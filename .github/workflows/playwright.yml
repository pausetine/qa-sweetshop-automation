name: Sweet Shop UI Tests
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run UI tests
        run: |
          python -m pytest -v --html=artifacts/report.html --self-contained-html --junitxml=artifacts/junit.xml
      - name: Upload reports, failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-shop-test-artifacts
          path: artifacts/
          if-no-files-found: warn
